name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  TEST_REF: ${{ inputs.ref || github.sha }}

jobs:
  build-and-unit:
    name: Build, analyze, and unit tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false

      - name: Prepare results directory
        run: mkdir -p TestResults

      - name: Run unit tests
        run: |
          xcodebuild \
            -project PtionsPlus.xcodeproj \
            -scheme "Ptions+" \
            -configuration Debug \
            -destination "platform=macOS" \
            -resultBundlePath TestResults/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test \
            -only-testing:PtionsPlusTests

      - name: Build Release
        run: |
          xcodebuild \
            -project PtionsPlus.xcodeproj \
            -scheme "Ptions+" \
            -configuration Release \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze
        run: |
          xcodebuild \
            -project PtionsPlus.xcodeproj \
            -scheme "Ptions+" \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Upload failed results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: build-unit-results
          path: TestResults
          if-no-files-found: ignore

  ui-tests:
    name: UI smoke tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TEST_REF }}
          persist-credentials: false

      - name: Prepare results directory
        run: mkdir -p TestResults

      - name: Run UI tests
        run: |
          xcodebuild \
            -project PtionsPlus.xcodeproj \
            -scheme "Ptions+" \
            -configuration Debug \
            -destination "platform=macOS" \
            -resultBundlePath TestResults/UITests.xcresult \
            test \
            -only-testing:PtionsPlusUITests

      - name: Upload failed results
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ui-test-results
          path: TestResults
          if-no-files-found: ignore
